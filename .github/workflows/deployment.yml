name: Build and deploy on Pi

on:
  push:
    branches: [ "master", "complete-rust-rewrite" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  IMAGE: boomtsy
  CONTAINER: boomtsy
  # Deliberately outside the repository, so the build context can never see it
  # and bake the secrets into an image layer.
  RUNTIME_ENV: /home/runner/boomtsy/runtime.env

jobs:
  check:
    runs-on: homegrown
    steps:
      - uses: actions/checkout@v4

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  deploy:
    # Only ever deploy from a real push; a pull request just gets checked.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: homegrown
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Write the runtime environment file
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          YTDLP_EXTRA_ARGS: ${{ vars.YTDLP_EXTRA_ARGS }}
          IDLE_TIMEOUT_SECONDS: ${{ vars.IDLE_TIMEOUT_SECONDS }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RUNTIME_ENV")"
          umask 077
          # Never echo this file. The previous pipeline ran `cat .env`, which put
          # every secret in plain text into the public workflow log.
          {
            printf 'DISCORD_BOT_TOKEN=%s\n' "$DISCORD_BOT_TOKEN"
            printf 'DISCORD_GUILD_ID=%s\n' "$DISCORD_GUILD_ID"
            printf 'YTDLP_EXTRA_ARGS=%s\n' "$YTDLP_EXTRA_ARGS"
            printf 'IDLE_TIMEOUT_SECONDS=%s\n' "$IDLE_TIMEOUT_SECONDS"
          } > "$RUNTIME_ENV"

      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Replace the running container
        run: |
          set -euo pipefail
          # The old pipeline just ran `docker run` again, which failed the moment
          # a container with the same name was already up.
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            --env-file "$RUNTIME_ENV" \
            "$IMAGE:latest"

      - name: Confirm it stayed up
        run: |
          set -euo pipefail
          sleep 15
          running=$(docker inspect -f '{{.State.Running}}' "$CONTAINER")
          if [ "$running" != "true" ]; then
            echo "container exited after start; last output:"
            docker logs --tail 50 "$CONTAINER"
            exit 1
          fi
          docker logs --tail 20 "$CONTAINER"

      - name: Drop images the deploy replaced
        run: docker image prune -f
